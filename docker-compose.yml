version: "3"

services:
  saleor-storefront:
    container_name: saleor-storefront
    build:
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL:?Error: NEXT_PUBLIC_SALEOR_API_URL not set}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:?Error: NEXT_PUBLIC_STOREFRONT_URL not set}
    restart: always
    ports:
      - "3000:3000"
    networks:
      - saleor_network
    # Security: Never commit sensitive credentials. Use .env file for secrets.
    # Environment variables should ONLY contain public values (NEXT_PUBLIC_* prefix).
    # For sensitive values (API keys, tokens, database URLs):
    #   1. Use env_file with .env.production (ensure .env.production is in .gitignore)
    #   2. Example: env_file:
    #        - .env.production
    #   3. Only reference non-sensitive variables in build.args above
    # DO NOT hardcode or commit:
    #   - Database credentials
    #   - API keys or tokens
    #   - Private URLs or endpoints
    #   - SSH keys or certificates

  # Add more containers below (nginx, postgres, etc.)

networks:
  saleor_network:
    external: false
