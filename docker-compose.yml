version: "3.8"

# Security: Credential and Access Control Hardening
# 1. All sensitive credentials (passwords, API keys) must be provided via environment variables
# 2. Use .env.local or Docker Secrets / Kubernetes Secrets in production
# 3. Database users must have minimal required privileges (not superuser)
# 4. Never commit .env files to version control
# 5. Rotate credentials regularly and audit access logs

services:
  saleor-storefront:
    container_name: saleor-storefront
    build:
      dockerfile: Dockerfile
      args:
        # Security: Only non-sensitive environment variables in build args
        NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL}
    restart: always
    ports:
      - "3000:3000"
    # Security: Use environment file for secrets, not hardcoded values
    env_file:
      - .env.local
    # Security: Restrict environment variable exposure to required variables only
    environment:
      # Only expose non-sensitive public variables
      NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL}
      NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL}
    # Security: Set resource limits to prevent resource exhaustion attacks
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    # Security: Use read-only filesystem where possible
    read_only: true
    # Security: Use tmpfs for temporary data instead of writable root
    tmpfs:
      - /tmp
      - /run
    # Security: Run with non-root user (must be configured in Dockerfile)
    user: "node"
    networks:
      - saleor_network
    # Security: Add health check to detect compromised containers
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Database service security configuration (if database service exists):
  # - Create dedicated database user (not root/admin)
  # - Grant only required permissions: SELECT, INSERT, UPDATE on application tables
  # - Revoke: DROP, ALTER, CREATE database privileges
  # - Use strong randomly-generated password (minimum 32 characters)
  # - Enable SSL/TLS for database connections in production
  # - Rotate credentials every 90 days
  # - Enable audit logging for all mutations
  # - Restrict database network access to application container only

  # Add more containers below (nginx, postgres, redis, etc.)
  # Security guidelines for additional services:
  # - Database: Use strong credentials from secrets, enforce minimal user privileges
  # - Redis: Disable dangerous commands (FLUSHDB, FLUSHALL), require authentication
  # - Nginx: Enable HTTPS, set security headers, validate input

networks:
  saleor_network:
    driver: bridge
    # Security: Isolate network - services should not be externally accessible by default
    ipam:
      config:
        - subnet: 172.20.0.0/16
