version: "3"

services:
  saleor-storefront:
    container_name: saleor-storefront
    build:
      dockerfile: Dockerfile
      args:
        # SECURITY: Build args must be provided via environment or .env file
      # no-new-privileges=true prevents escalation attacks via setuid/setgid binaries
    security_opt:
      - no-new-privileges:true
    # Drop ALL Linux capabilities and selectively add only NET_BIND_SERVICE for port binding
    # This prevents container from using dangerous capabilities (SYS_ADMIN, NET_ADMIN, etc.)
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Read-only root filesystem prevents file-based persistence of compromises
    read_only_root_filesystem: true
    # tmpfs for /tmp allows temporary file creation without disk persistenc  # Never commit secrets to docker-compose.yml or hard-code in docker-compose.yml
        # Use .env file or container orchestration secrets management (e.g., Docker Secrets, K8s Secrets)
        NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL}
    restart: always
    ports:
      - "3000:3000"
    networks:
      - saleor_network
    # SECURITY: Container privilege restrictions - enforce least-privilege model
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /.next
    user: "node:node"
    # Do not expose secrets via environment - use Docker secrets or external secret management
    # Example for Docker Secrets: secrets: [api_token]
    # Example for env file: env_file: .env.production (never commit this file)

  # Add more containers below (nginx, postgres, etc.)

networks:
  saleor_network:
    external: false
