version: "3.8"

services:
  saleor-storefront:
    container_name: saleor-storefront
    build:
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL}
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      # Security: Bind to specific interface (127.0.0.1) in dev, use reverse proxy in prod
      - "3000:3000"
    environment:
      # Ensure Node.js runs in production mode
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/apt
    networks:
      - saleor_network

  # Add more containers below (nginx, postgres, etc.)

networks:
  saleor_network:
    external: false
