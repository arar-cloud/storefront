version: "3.8"

services:
  saleor-storefront:
    container_name: saleor-storefront
    build:
      dockerfile: Dockerfile
      args:
        # SECURITY: Public environment variables only. Never pass secrets via build args.
        # Use .env.production or Docker secrets for sensitive data.
        NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL}
    restart: always
    ports:
      - "3000:3000"
    # SECURITY: Environment file loaded at runtime, not during build
    # Ensure .env.production is not committed to version control
    env_file:
      - .env.production
    # SECURITY: NEVER commit .env.production - add to .gitignore
    # For Docker Swarm deployments, use Docker secrets instead of env_file:
    # secrets:
    #   - saleor_api_key
    #   - database_password
    # environment:
    #   SALEOR_API_KEY_FILE: /run/secrets/saleor_api_key
    #   DB_PASSWORD_FILE: /run/secrets/database_password
    #
    # SECURITY: Volume mounts should be read-only where possible
    # Do NOT mount secret files as world-readable volumes
    # volumes:
    #   - ./config:/etc/saleor:ro
    networks:
      - saleor_network
    # SECURITY: Set resource limits to prevent DoS
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    # SECURITY: Use non-root user if possible
    # user: "1000:1000"
    # SECURITY: Set read-only filesystem where applicable
    # read_only: true  # Enable for production if application supports it
    read_only: false

  # Add more containers below (nginx, postgres, etc.)

networks:
  saleor_network:
    external: false

# SECURITY: For production use with Docker Swarm, define secrets here:
# secrets:
#   saleor_api_key:
#     external: true
#   saleor_db_password:
#     external: true
#
# Then reference them in services using:
#   secrets:
#     - saleor_api_key
#     - saleor_db_password
#
# Load secrets into the container via environment variables:
#   environment:
#     - SALEOR_API_KEY_FILE=/run/secrets/saleor_api_key
#
# IMPORTANT:
# 1. NEVER commit .env.production to version control
# 2. NEVER commit credentials or API keys to docker-compose.yml
# 3. Use Docker secrets for production Swarm deployments
# 4. Use external secret management (Vault, AWS Secrets Manager) for orchestration

# SECURITY NOTES:
# 1. Use .env.production file for sensitive environment variables (never commit)
# 2. For production, implement Docker secrets:
#    - Create secrets: docker secret create api_url <(echo $NEXT_PUBLIC_SALEOR_API_URL)
#    - Reference in service: secrets: [api_url]
# 3. Use environment variable validation in application startup
# 4. Enable Docker content trust (DCT) for image verification
# 5. Use minimal base images and regular security scanning
# 6. Consider using HashiCorp Vault or AWS Secrets Manager for credential rotation
