version: "3"

# SECURITY POLICY: Environment Variable Validation
#
# CRITICAL: All environment variables passed to containers must be validated before startup.
# Failure to validate can allow attackers to inject malicious URLs or commands.
#
# Required variables (must be validated URLs):
# - NEXT_PUBLIC_SALEOR_API_URL: GraphQL API endpoint (must be valid HTTPS URL in production)
# - NEXT_PUBLIC_STOREFRONT_URL: Storefront public URL (must be valid URL)
#
# Validation is enforced by:
# 1. src/lib/security/validate-env-url.ts - Centralized URL validation utility
# 2. scripts/validate-docker-env.js - Pre-startup environment validation
#
# To validate before running: node scripts/validate-docker-env.js
#
# DO NOT skip validation in production. Attack surface includes:
# - Malicious GraphQL schema injection via NEXT_PUBLIC_SALEOR_API_URL
# - Open redirect attacks via NEXT_PUBLIC_STOREFRONT_URL
# - Command injection through improperly escaped URLs

services:
  saleor-storefront:
    container_name: saleor-storefront
    build:
      dockerfile: Dockerfile
      args:
        # SECURITY: These URLs are validated by src/lib/security/validate-env-url.ts
        # - Schema URL is validated during codegen (.graphqlrc.ts and src/checkout/graphql/codegen.ts)
        # - Storefront URL should be validated by scripts/validate-docker-env.js before startup
        NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL}
    restart: always
    ports:
      - 3000:3000
    networks:
      - saleor_network

  # Add more containers below (nginx, postgres, etc.)

networks:
  saleor_network:
    external: false
