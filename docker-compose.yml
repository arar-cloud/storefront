version: "3.9"

# ============================================================================
# SECURITY HARDENING REQUIREMENTS
# ============================================================================
#
# CREDENTIAL MANAGEMENT (CRITICAL)
# ✓ All sensitive values MUST be sourced from environment variables, not hardcoded
# ✓ Use .env file (never commit to version control)
# ✓ For production: use Docker Secrets or external secrets manager (HashiCorp Vault, AWS Secrets Manager)
# ✓ Use .env.example as template without actual values
#
# Example .env (never commit this):
#   NEXT_PUBLIC_SALEOR_API_URL=https://api.saleor.example.com
#   NEXT_PUBLIC_STOREFRONT_URL=https://storefront.example.com
#   DATABASE_PASSWORD=<secure-password-do-not-commit>
#   API_SECRET_KEY=<secret-key-do-not-commit>
#   SALEOR_GRAPHQL_SECRET=<token-for-api-auth>
#
# Secrets Configuration (Production):
#   Use docker secrets or external secret management instead of .env
#   Example with Docker Secrets:
#     secrets:
#       saleor_api_url:
#         external: true
#       saleor_secret:
#         external: true

services:
  saleor-storefront:
    container_name: saleor-storefront
    environment:
      # NOTE: These variables are validated at build time in .graphqlrc.ts
      # NEXT_PUBLIC_* variables are embedded in the build and visible to client
      # - NEXT_PUBLIC_SALEOR_API_URL: Must be HTTPS URL, validated in .graphqlrc.ts
      # - NEXT_PUBLIC_STOREFRONT_URL: Must be HTTPS URL for production
      # DO NOT use these env vars for sensitive credentials (they are public)
      NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL:?Error: NEXT_PUBLIC_SALEOR_API_URL not set}
      NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:?Error: NEXT_PUBLIC_STOREFRONT_URL not set}
      # Private variables (not exposed to client)
      NODE_ENV: ${NODE_ENV:-development}
    build:
      dockerfile: Dockerfile
      args:
        # These are passed to the build process only
        NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL:?Error: NEXT_PUBLIC_SALEOR_API_URL not set}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:?Error: NEXT_PUBLIC_STOREFRONT_URL not set}
    restart: always
    ports:
      - 3000:3000
    # SECURITY: Use external secrets for production instead of environment variables
    # secrets:
    #   - api_secret_key
    networks:
      - saleor_network

  # Add more containers below (nginx, postgres, etc.)

networks:
  saleor_network:
    external: false

# SECURITY: Define secrets for production use (requires Docker Swarm or Compose v3.9+)
# secrets:
#   api_secret_key:
#     external: true
