version: "3"

services:
  saleor-storefront:
    container_name: saleor-storefront
    build:
      dockerfile: Dockerfile
      args:
        # SECURITY CRITICAL: Build args are read from environment variables only
        # DO NOT hardcode secrets here. Use .env file or orchestrator secrets
        NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL}
    restart: always
    ports:
      - 3000:3000
    env_file:
      # SECURITY CRITICAL: Load environment variables from .env.local only
      # - .env.local must NEVER be committed to git (add to .gitignore)
      # - Use orchestrator secrets (Docker Swarm, Kubernetes) for production
      # - Never hardcode API keys, auth tokens, or sensitive credentials
      - .env.local
    environment:
      # SECURITY: Runtime environment variables should only reference non-sensitive configs
      # BEST PRACTICES:
      # - Never hardcode secrets (API keys, auth tokens, database passwords) in this file
      # - For production, use Docker secrets (docker swarm), Kubernetes secrets, or HashiCorp Vault
      # - For development, use .env.local with proper .gitignore rules
      # - Rotate secrets regularly and audit access logs
      NODE_ENV: production
    networks:
      - saleor_network

  # Add more containers below (nginx, postgres, etc.)

networks:
  saleor_network:
    external: false
