version: "3"

services:
  saleor-storefront:
    container_name: saleor-storefront
    build:
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL}
    restart: always
    ports:
      - 3000:3000
    networks:
      - saleor_network
    # Security context: run with minimal privileges
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Resource limits to prevent DoS and runaway processes
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    # Read-only filesystem with tmpfs for writable paths
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
      - /.next
    environment:
      - NODE_ENV=production

  # Add more containers below (nginx, postgres, etc.)

networks:
  saleor_network:
    external: false
